[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-auth"
dynamic = ["version"]
description = "Minimal CLI proxy and library for Odoo calls over XML-RPC or JSON-2 — injects credentials transparently"
requires-python = ">=3.11.8,!=3.12.0,!=3.12.1"
license = "Apache-2.0"
readme = "README.md"
dependencies = [
    "requests>=2.32.3",
    "urllib3>=2.6.0",
]

[project.scripts]
odoo-auth = "odoo_auth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "odoo_auth.__version__"}
